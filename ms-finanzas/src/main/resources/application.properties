spring.application.name=ms-finanzas
# Todos los servicios usan el 9090 (cada uno en su contenedor). SERVER_PORT solo sirve para correr varios
# a la vez en un mismo PC fuera de Docker.
server.port=${SERVER_PORT:9090}

# Base de datos MySQL (en Docker el host es "mysql"; se sobreescribe con DB_URL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_junta_finanzas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clave compartida para firmar (ms-admin) y validar (todos) los JWT. Minimo 32 caracteres.
jwt.secret=${SECRET:junta_zaror_clave_jwt_demo_2026_cambiar_en_produccion}

# URL interna de ms-reservas (se usa para validar que la reserva existe)
api.reservas.url=${RESERVAS_URL:http://localhost:9092}

# ms-notificaciones (crea avisos) y clave interna compartida entre microservicios
api.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:9095}
internal.key=${INTERNAL_KEY:junta-interno-2026-cambiar}

management.endpoints.web.exposure.include=health
