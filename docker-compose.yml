# Levantar todo el backend:   docker compose up -d --build
# (antes compilar los .jar con build-all.bat / build-all.sh)
# TODO el sistema usa el puerto 9090: el API Gateway lo publica en el PC y es el único punto de entrada de la app
# (http://IP_DEL_PC:9090). Los microservicios también escuchan en 9090, pero dentro de su contenedor (red interna de Docker).

x-common-env: &common-env
  SECRET: "junta_zaror_clave_jwt_demo_2026_cambiar_en_produccion"
  INTERNAL_KEY: "junta-interno-2026-cambiar"

x-db-env: &db-env
  DB_USER: root
  DB_PASSWORD: junta1234

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: junta1234
      TZ: America/Santiago
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pjunta1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    build: ./api-gateway
    ports:
      - "9090:9090"
    environment:
      <<: *common-env
    depends_on:
      - ms-admin
      - ms-reservas
      - ms-finanzas
      - ms-notificaciones

  ms-admin:
    build: ./ms-admin
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/bd_junta_admin?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy

  ms-reservas:
    build: ./ms-reservas
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/bd_junta_reservas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
      NOTIFICACIONES_URL: http://ms-notificaciones:9090
    depends_on:
      mysql:
        condition: service_healthy

  ms-notificaciones:
    build: ./ms-notificaciones
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/bd_junta_notificaciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy

  ms-finanzas:
    build: ./ms-finanzas
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/bd_junta_finanzas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
      RESERVAS_URL: http://ms-reservas:9090
      NOTIFICACIONES_URL: http://ms-notificaciones:9090
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
