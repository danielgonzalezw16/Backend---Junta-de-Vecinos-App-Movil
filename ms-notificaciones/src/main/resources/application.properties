spring.application.name=ms-notificaciones
# Todos los servicios usan el 9090 (cada uno en su contenedor). SERVER_PORT solo sirve para correr varios
# a la vez en un mismo PC fuera de Docker.
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_junta_notificaciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${SECRET:junta_zaror_clave_jwt_demo_2026_cambiar_en_produccion}

# Clave compartida entre microservicios para crear avisos (/internal/**, no se expone por el gateway)
internal.key=${INTERNAL_KEY:junta-interno-2026-cambiar}

management.endpoints.web.exposure.include=health
